server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: no client-side router, everything is in-app
    # React state, so every path just serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's assets/*) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html isn't hashed — never cache it, so a redeploy is picked
    # up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # sql.js fetches this wasm binary at runtime. Force the correct
    # content type via default_type (scoped to just this file, unlike a
    # bare `types {}` block, which would otherwise clobber every other
    # MIME mapping in this context) so instantiateStreaming doesn't fall
    # back to the slower path.
    location = /sql-wasm.wasm {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }
}
